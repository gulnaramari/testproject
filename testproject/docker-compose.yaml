services:
  web:
    build: .
    container_name: my-django-app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"         # поменяй на 8001:8000, если 8000 уже занят
    env_file: .env
    volumes:
      - my-media-volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: my-django-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"         # убери или поменяй, если уже есть другой Postgres на 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  my-media-volume:
  pgdata:
